name: Format Plans Preview Once

on:
  push:
    branches: [feat/membership-plans-preview]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/membership-plans-preview
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
          run_install: false
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Format Plans preview
        working-directory: frontend
        run: pnpm exec prettier --write src/pages/PlanPreviewPage.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/PlanPreviewPage.tsx
          git commit -m "style: format Membership Plans preview"
          git push origin HEAD:feat/membership-plans-preview
